<script type="module">
// Box Fort: a hide-and-seek game with boxes, ramps and locks, after a clip of agents playing hide-and-seek.
// Contract for the playtest: ?autostart (= watch), ?mode=hider|seeker|watch, ?seed=N, ?brain=local|jev,
// ?jev=URL, ?prep=s, ?hunt=s; window.__game.state is read-only.
// Every AI character is driven by a "brain": Jev (TypeSafe System One, through /api/jev) when a key is set on the
// server, otherwise a local utility brain with the same options. The brain picks a plan; the body walks, pushes,
// drags, locks and climbs.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Q = new URLSearchParams(location.search);
let seed0 = +(Q.get('seed') || 1);
let seed = seed0;
const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const PREP = +(Q.get('prep') || 16), HUNT = +(Q.get('hunt') || 40);
const STEPS = clamp(+(Q.get('timescale') || 1) | 0, 1, 16);   // debug: simulate N fixed steps per frame

// sampled from the clip: pale tiles, white walls, grey block city, warm yellow props, glowing red and cyan agents
const PALETTE = { bg: 0xc4c8ce, floor: 0xdfe1e4, line: 0xc6cace, wall: 0xeceef0, wallTop: 0xf7f8f9, city: 0xb8bcc2,
  box: 0xf2b324, locked: 0x8f7134, hider: 0x38c6ff, seeker: 0xff3d4f };

// ---------- renderer, look ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PALETTE.bg);
scene.fog = new THREE.Fog(PALETTE.bg, 26, 62);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xf4f7fb, 0x9aa0a8, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.9);
sun.position.set(-8, 22, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.45, 0.93);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uLift: { value: new THREE.Vector3(0.0, 0.006, 0.018) },
    uGain: { value: new THREE.Vector3(0.99, 1.0, 1.03) }, uVignette: { value: 0.28 }, uGrain: { value: 0.022 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uVignette, uGrain; uniform vec3 uLift, uGain; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; c = c * uGain + uLift;
      c *= 1. - uVignette * smoothstep(.35, .95, length(vUv - .5) * 1.25);
      c += (h(vUv * 999. + uTime) - .5) * uGrain; gl_FragColor = vec4(c, 1.); }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());

// ---------- arena ----------
// x to the right, z toward the camera. The fort room is the corner x,z in [2,10] with door A (top) and door B (left).
const HALF = 10, WALL_H = 1.1, BOX = 1.4, RAMP_L = 2.4, RAMP_W = 1.4, R = 0.34;
const WALLS = [
  { x0: -10.4, z0: -10.4, x1: 10.4, z1: -10 }, { x0: -10.4, z0: 10, x1: 10.4, z1: 10.4 },
  { x0: -10.4, z0: -10, x1: -10, z1: 10 }, { x0: 10, z0: -10, x1: 10.4, z1: 10 },
  { x0: 1.8, z0: 1.8, x1: 5, z1: 2.2 }, { x0: 7, z0: 1.8, x1: 10, z1: 2.2 },          // room top wall, door A gap x 5..7
  { x0: 1.8, z0: 2.2, x1: 2.2, z1: 5 }, { x0: 1.8, z0: 7, x1: 2.2, z1: 10 },          // room left wall, door B gap z 5..7
  { x0: -4.2, z0: -1, x1: -3.8, z1: 5 }, { x0: -2, z0: -6.2, x1: 3.5, z1: -5.8 },     // two cover walls outside
].map(w => ({ ...w, h: WALL_H }));
// a box plugs a doorway by sitting in the gap; it is staged outside, then pulled in from the room side
const DOORS = {
  A: { x: 6, z: 2, n: [0, 1], plug: { x: 6, z: 2 }, stage: { x: 6, z: 0.1 }, out: { x: 6, z: 0.4 }, look: { x: 6, z: 4 } },
  B: { x: 2, z: 6, n: [1, 0], plug: { x: 2, z: 6 }, stage: { x: 0.1, z: 6 }, out: { x: 0.4, z: 6 }, look: { x: 4, z: 6 } },
};
const inRoom = (x, z) => x > 2.2 && z > 2.2 && x < 10 && z < 10;
// ramp spots against the outside of the room walls, high end toward the wall
const RAMP_SPOTS = [
  { id: 'W1a', x: 3.5, z: 1.78 - RAMP_L / 2, dir: 1 }, { id: 'W1b', x: 8.5, z: 1.78 - RAMP_L / 2, dir: 1 },
  { id: 'W2a', x: 1.78 - RAMP_L / 2, z: 3.5, dir: 0 }, { id: 'W2b', x: 1.78 - RAMP_L / 2, z: 8.5, dir: 0 },
];

const floorTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#d2d6db'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = '#c4c8cd'; g.lineWidth = 4; g.strokeRect(0, 0, 256, 256);
  g.strokeStyle = '#d3d6da'; g.lineWidth = 2; g.beginPath(); g.moveTo(128, 0); g.lineTo(128, 256); g.moveTo(0, 128); g.lineTo(256, 128); g.stroke();
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 10);
  t.anisotropy = 8; t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.85 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const under = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0xaeb2b8, roughness: 1 }));
under.rotation.x = -Math.PI / 2; under.position.y = -0.02; under.receiveShadow = true; scene.add(under);

const wallMat = new THREE.MeshStandardMaterial({ color: 0xd9dce0, roughness: 0.8 });
for (const w of WALLS) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w.x1 - w.x0, w.h, w.z1 - w.z0), wallMat);
  m.position.set((w.x0 + w.x1) / 2, w.h / 2, (w.z0 + w.z1) / 2); m.castShadow = m.receiveShadow = true; scene.add(m);
}
// the grey block city around the arena, as in the clip: instanced, grouped in rows, quieter with distance
{
  const geo = new THREE.BoxGeometry(1, 1, 1), mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
  const list = [];
  for (let x = -34; x <= 34; x += 1.6) for (let z = -34; z <= 30; z += 1.6) {
    if (Math.abs(x) < 11.6 && Math.abs(z) < 11.6) continue;
    const d = Math.max(Math.abs(x), Math.abs(z));
    if (rand() < 0.18) continue;
    list.push([x + (rand() - .5) * .2, z + (rand() - .5) * .2, 0.25 + rand() * rand() * (d < 15 ? 1.6 : 3.2)]);
  }
  const city = new THREE.InstancedMesh(geo, mat, list.length), o = new THREE.Object3D(), col = new THREE.Color();
  list.forEach(([x, z, h], i) => {
    o.position.set(x, h / 2 - 0.02, z); o.scale.set(1.45, h, 1.45); o.updateMatrix(); city.setMatrixAt(i, o.matrix);
    city.setColorAt(i, col.setHex(PALETTE.city).offsetHSL(0, 0, (rand() - .5) * 0.08));
  });
  city.receiveShadow = true; city.castShadow = false; scene.add(city);
}

// ---------- props ----------
const boxGeo = new THREE.BoxGeometry(BOX, WALL_H, BOX);
const rampGeo = (() => {   // wedge: low end at -L/2, high end at +L/2 along +x (dir 0)
  const s = new THREE.Shape(); s.moveTo(-RAMP_L / 2, 0); s.lineTo(RAMP_L / 2, 0); s.lineTo(RAMP_L / 2, WALL_H); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: RAMP_W, bevelEnabled: false }); g.translate(0, 0, -RAMP_W / 2); return g;
})();
const xLines = (w, h, d) => {   // edges plus an X on each side face, the "locked" marking from the clip
  const p = [], X = w / 2, Y = h, Z = d / 2;
  const quad = (a, b, c, e) => p.push(...a, ...c, ...b, ...e);
  quad([-X, 0, Z], [X, 0, Z], [X, Y, Z], [-X, Y, Z]); quad([-X, 0, -Z], [X, 0, -Z], [X, Y, -Z], [-X, Y, -Z]);
  quad([X, 0, -Z], [X, 0, Z], [X, Y, Z], [X, Y, -Z]); quad([-X, 0, -Z], [-X, 0, Z], [-X, Y, Z], [-X, Y, -Z]);
  quad([-X, Y, -Z], [X, Y, -Z], [X, Y, Z], [-X, Y, Z]);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); return g;
};
const lockGeo = xLines(BOX + 0.02, WALL_H + 0.01, BOX + 0.02);

function makeObj(id, type, x, z, dir = 0) {
  const mat = new THREE.MeshStandardMaterial({ color: PALETTE.box, roughness: 0.45, emissive: 0x000000 });
  const mesh = new THREE.Mesh(type === 'box' ? boxGeo : rampGeo, mat);
  mesh.castShadow = mesh.receiveShadow = true;
  const lines = new THREE.LineSegments(type === 'box' ? lockGeo : new THREE.EdgesGeometry(rampGeo),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
  lines.visible = false;
  const g = new THREE.Group(); g.add(mesh, lines); scene.add(g);
  if (type === 'box') mesh.position.y = WALL_H / 2;
  return { id, type, x, z, dir, lockedBy: null, g, mesh, lines, mat };
}
function objHalf(o) { if (o.type === 'box') return [BOX / 2, BOX / 2]; return o.dir % 2 === 0 ? [RAMP_L / 2, RAMP_W / 2] : [RAMP_W / 2, RAMP_L / 2]; }
function objRect(o, x = o.x, z = o.z) { const [hx, hz] = objHalf(o); return { x0: x - hx, z0: z - hz, x1: x + hx, z1: z + hz }; }
const DIRV = [[1, 0], [0, 1], [-1, 0], [0, -1]];

// ---------- agents ----------
function makeAgent(id, team, x, z, name) {
  const color = team === 'hider' ? PALETTE.hider : PALETTE.seeker;
  const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.55, roughness: 0.35 });
  const g = new THREE.Group();
  const look = new THREE.Group(); look.scale.setScalar(1.22); g.add(look);   // drawn a little larger than the collider, as in the clip
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.32, 6, 12), mat); body.position.y = 0.42;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 20, 16), mat); head.position.y = 0.92;
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), eyeMat), e2 = e1.clone();
  e1.position.set(0.1, 0.96, 0.21); e2.position.set(-0.1, 0.96, 0.21);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.36, 0.46, 32), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.55, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02;
  for (const m of [body, head]) m.castShadow = true;
  look.add(body, head, e1, e2); g.add(ring); scene.add(g);
  let cone = null;
  if (team === 'seeker') {   // the vision fan on the floor, faint
    cone = new THREE.Mesh(new THREE.CircleGeometry(VIEW_R, 32, -VIEW_A, VIEW_A * 2),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.07, depthWrite: false }));
    cone.rotation.x = -Math.PI / 2; scene.add(cone);
  }
  return { id, team, name, x, z, y: 0, vy: 0, face: team === 'hider' ? -Math.PI / 2 : Math.PI / 4, held: null, grab: [0, 0],
    plan: null, human: false, g, body, head, ring, cone, mat, seen: false, lastSeenBy: 0, decision: null, stuck: 0, moved: 0 };
}
const VIEW_R = 15, VIEW_A = 1.2;

// lasers from a seeker to each hider it sees
const laserMat = new THREE.MeshBasicMaterial({ color: 0xff3d4f, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false });
const lasers = Array.from({ length: 6 }, () => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1, 6, 1, true), laserMat); m.visible = false; scene.add(m); return m; });

// ---------- world state ----------
const G = { phase: 'title', mode: 'watch', t: 0, score: { hider: 0, seeker: 0 }, tick: 0, agents: [], objs: [], decisions: 0, endT: 0, winner: '' };

function clearWorld() {
  for (const a of G.agents) { scene.remove(a.g); if (a.cone) scene.remove(a.cone); }
  for (const o of G.objs) scene.remove(o.g);
  G.agents = []; G.objs = [];
}
function newRound(mode) {
  clearWorld();
  seed = seed0;
  const j = () => (rand() - 0.5) * 1.6;
  G.objs.push(makeObj('box1', 'box', 4.2 + j(), -1.2 + j()));
  G.objs.push(makeObj('box2', 'box', -0.8 + j(), 4.6 + j()));
  G.objs.push(makeObj('box3', 'box', 7.2 + j() * .5, 7.6 + j() * .5));
  G.objs.push(makeObj('ramp', 'ramp', -6.5 + j(), 1.5 + j() * 2, Math.floor(rand() * 4)));
  G.agents.push(makeAgent('h1', 'hider', 5.5 + j(), -2.8 + j(), '파랑1'));
  G.agents.push(makeAgent('h2', 'hider', 0.8 + j(), 2.6 + j(), '파랑2'));
  G.agents.push(makeAgent('s1', 'seeker', -7.5 + j() * .5, -7.5 + j() * .5, '빨강1'));
  G.agents.push(makeAgent('s2', 'seeker', -8 + j() * .5, -4 + j() * .5, '빨강2'));
  G.mode = mode; G.t = 0; G.tick = 0; G.score = { hider: 0, seeker: 0 }; G.decisions = 0;
  if (mode === 'hider') G.agents[0].human = true;
  if (mode === 'seeker') G.agents[2].human = true;
  for (const a of G.agents) a.g.position.set(a.x, 0, a.z);
  for (const o of G.objs) syncObj(o);
  brain.reset();
  G.phase = 'prep';
}
const human = () => G.agents.find(a => a.human);

// ---------- physics: heights, collisions, pushing, dragging ----------
const inside = (r, x, z) => x >= r.x0 && x <= r.x1 && z >= r.z0 && z <= r.z1;
const overlap = (a, b, m = 0) => a.x0 < b.x1 - m && a.x1 > b.x0 + m && a.z0 < b.z1 - m && a.z1 > b.z0 + m;
function heightAt(x, z, skip) {
  let h = 0;
  for (const w of WALLS) if (inside(w, x, z)) h = Math.max(h, w.h);
  for (const o of G.objs) {
    if (o === skip || !inside(objRect(o), x, z)) continue;
    if (o.type === 'box') h = Math.max(h, WALL_H);
    else { const [dx, dz] = DIRV[o.dir]; const u = ((x - o.x) * dx + (z - o.z) * dz) / RAMP_L + 0.5; h = Math.max(h, clamp(u, 0, 1) * WALL_H); }
  }
  return h;
}
function circleHeight(x, z, r, skip) {
  let h = heightAt(x, z, skip);
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; h = Math.max(h, heightAt(x + Math.cos(a) * r, z + Math.sin(a) * r, skip)); }
  return h;
}
function circleRect(x, z, r, rc) { const cx = clamp(x, rc.x0, rc.x1), cz = clamp(z, rc.z0, rc.z1); return (x - cx) ** 2 + (z - cz) ** 2 < r * r; }
function riders(o) { const rc = objRect(o); return G.agents.filter(a => a.y > 0.6 && inside(rc, a.x, a.z)); }
function objFree(o, nx, nz, mover) {

          const want = Math.hypot(...v) > 0.5;
          if (!want) a.prog = null;
          else if (!a.prog) a.prog = { x: a.x, z: a.z, t: 0 };
          else if ((a.prog.t += dt) > 2.2) { if (Math.hypot(a.x - a.prog.x, a.z - a.prog.z) < 0.35) { if (a.held) release(a); a.plan.done = true; } a.prog = null; }
        }
      }
      stepAgent(a, v[0], v[1], dt);
      if (a.held && !reachable(a, a.held) && Math.hypot(a.held.x - a.x - a.grab[0], a.held.z - a.z - a.grab[1]) > 0.3) release(a);
    }
    // vision and scoring
    let li = 0;
    for (const h of G.agents) if (h.team === 'hider') h.seen = false;
    if (G.phase === 'hunt') for (const s of G.agents.filter(a => a.team === 'seeker')) for (const h of G.agents.filter(a => a.team === 'hider')) {
      if (!sees(s, h)) continue;
      if (!h.seen && G.t - h.lastSeenBy > 1.5) sfx('seen');
      h.seen = true; h.lastSeenBy = G.t;
      if (inRoom(h.x, h.z) && doorSealed('A') && doorSealed('B')) G.fortBroken = s.y > 0.6 || inRoom(s.x, s.z) ? 'ramp' : 'other';
      s.lastSeen = s.lastSeen || {}; s.lastSeen[h.id] = { x: h.x, z: h.z, t: G.t };
      const l = lasers[li++]; if (!l) continue;
      const p0 = new THREE.Vector3(s.x, s.y + 0.95, s.z), p1 = new THREE.Vector3(h.x, h.y + 0.75, h.z);
      l.position.copy(p0).lerp(p1, 0.5); l.scale.set(1, p0.distanceTo(p1), 1);
      l.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p1.clone().sub(p0).normalize()); l.visible = true;
    }
    for (; li < lasers.length; li++) lasers[li].visible = false;
    if (G.phase === 'hunt') {
      G.tick += dt;
      while (G.tick >= 1) { G.tick -= 1; if (G.agents.some(a => a.team === 'hider' && a.seen)) G.score.seeker++; else G.score.hider++; }
      if (G.t >= PREP + HUNT) {
        G.phase = 'end'; G.endT = 0; sfx('end');
        G.winner = G.score.hider > G.score.seeker ? 'hider' : G.score.seeker > G.score.hider ? 'seeker' : 'draw';
        brain.endRound();
        $('endTitle').textContent = G.winner === 'hider' ? '파랑 팀 승리' : G.winner === 'seeker' ? '빨강 팀 승리' : '무승부';
        $('endText').textContent = `숨은 시간 ${G.score.hider}초 · 들킨 시간 ${G.score.seeker}초 · AI 판단 ${G.decisions}회`;
        $('end').hidden = false;
      }
    }
  } else if (G.phase === 'end') {
    G.endT += dt;
    if (i.start) startGame(G.mode);
    else if (G.mode === 'watch' && G.endT > 6) { seed0++; startGame('watch'); }
  }
}
function render(dt) {

  for (const a of G.agents) syncAgent(a, dt);
  for (const o of G.objs) syncObj(o);
  if (G.phase !== 'title') {
    $('sh').textContent = `파랑 ${G.score.hider}`; $('ss').textContent = `빨강 ${G.score.seeker}`;
    $('tm').textContent = G.phase === 'prep' ? `준비 ${Math.ceil(PREP - G.t)}` : G.phase === 'hunt' ? `${Math.ceil(PREP + HUNT - G.t)}초` : '끝';
    $('brain').textContent = 'AI: ' + brain.reason;
    if (panelOn && (G.frame = (G.frame || 0) + 1) % 10 === 0) renderPanel();
  }

  // camera: the clip's high three-quarter view of the whole arena, leaning toward the player
  const h = human();
  const aim = h ? new THREE.Vector3(h.x * 0.35, 0, h.z * 0.35 + 0.5) : new THREE.Vector3(Math.sin(G.t * 0.1) * 0.6, 0, 0.5);
  camTarget.lerp(aim, 1 - Math.exp(-2 * dt));
  const portrait = innerHeight > innerWidth;
  const back = portrait ? 1.9 : panelOn && innerWidth > 700 ? 1.07 : 1;
  camera.position.set(camTarget.x, 21 * back, camTarget.z + 15 * back);
  camera.lookAt(camTarget.x, 0, camTarget.z + 0.3);
  // keep the arena clear of the AI panel on wide screens
  if (panelOn && !portrait && G.phase !== 'title' && innerWidth > 700) camera.setViewOffset(innerWidth, innerHeight, 105, 0, innerWidth, innerHeight);
  else camera.clearViewOffset();
  grade.uniforms.uTime.value += dt;
  composer.render();
}

window.__game = { get state() {
  const p = human();
  return { phase: G.phase, mode: G.mode, t: +G.t.toFixed(2), prep: PREP, hunt: HUNT, score: { ...G.score }, brain: brain.mode, decisions: G.decisions,
    player: p ? { id: p.id, team: p.team, x: p.x, z: p.z, y: p.y, holding: p.held?.id || null, seen: p.seen } : null,
    agents: G.agents.map(a => ({ id: a.id, team: a.team, x: a.x, z: a.z, y: a.y, plan: a.plan && !a.plan.done ? a.plan.key : null, seen: a.seen, holding: a.held?.id || null })),
    objects: G.objs.map(o => ({ id: o.id, type: o.type, x: o.x, z: o.z, dir: o.dir, lockedBy: o.lockedBy })),
    doors: { A: doorBlocker('A')?.id || null, B: doorBlocker('B')?.id || null, sealedA: doorSealed('A'), sealedB: doorSealed('B') },
    rampSpots: RAMP_SPOTS, plugs: { A: DOORS.A.plug, B: DOORS.B.plug } };
} };

if (Q.has('debug')) window.__dbg = { G, findPath, objFree, objRect, carry, options };
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
await brain.probe();
$('brainTitle').textContent = 'AI: ' + brain.reason;
$('codeBox').hidden = !(brain.mode === 'jev' && brain.codeRequired);
const qm = Q.get('mode') || (Q.has('autostart') ? 'watch' : null);
if (qm) startGame(qm); else G.phase = 'title';
// ?manual: the recorder advances one frame at a time (window.__frame()), each frame STEPS x 1/30 s of game time
if (Q.has('manual')) window.__skip = t => { while (G.t < t && G.phase !== 'end') simulate(1 / 30, NOINPUT); };
if (Q.has('manual')) window.__frame = () => { const i = input(); for (let k = 0; k < STEPS; k++) simulate(1 / 30, k === 0 ? i : NOINPUT); render(1 / 30 * STEPS); };
else frame();
</script>
</body>
</html>
